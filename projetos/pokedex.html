<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Consulte informações sobre Pokémon nesta Pokédex.">
    <meta name="author" content="Larissa Ember">
    <link rel="stylesheet" href="css/style.css">
    <title>Pokédex</title>
</head>

<body>
    <main aria-labelledby="page-title">
        <h1 id="page-title" class="sr-only">Pokédex</h1>

        <img class="pokemon__image" alt="" aria-hidden="true" hidden>

        <h2 class="pokemon__data" aria-live="polite">
            <span class="pokemon__number"></span>
            <span aria-hidden="true"> - </span>
            <span class="pokemon__name"></span>
        </h2>

        <form class="form" role="search">
            <label class="sr-only" for="pokemon-search">
                Pesquisar Pokémon por nome ou número
            </label>
            <input id="pokemon-search" name="pokemon" type="search"
                class="input__search" placeholder="Nome ou número"
                autocomplete="off" spellcheck="false" required>
        </form>

        <div class="buttons">
            <button type="button" class="button btn-prev">Anterior</button>
            <button type="button" class="button btn-next">Próximo</button>
        </div>

        <img src="./images/pokedex.png" alt="Ilustração de uma Pokédex" class="pokedex">
    </main>

    <section class="pokemon__details" aria-labelledby="details-title" aria-live="polite">
        <h2 id="details-title">Detalhes</h2>
        <dl class="details__list">
            <div><dt>Tipo</dt><dd class="pokemon__types">-</dd></div>
            <div><dt>Habilidades</dt><dd class="pokemon__abilities">-</dd></div>
            <div><dt>Altura</dt><dd class="pokemon__height">-</dd></div>
            <div><dt>Peso</dt><dd class="pokemon__weight">-</dd></div>
        </dl>
        <h3>Estatísticas base</h3>
        <ul class="pokemon__stats"></ul>
    </section>

    <footer>
        <a href="../index.html" class="button">Página inicial</a>
    </footer>

    <script src="js/script.js" defer></script>
</body>

</html>
